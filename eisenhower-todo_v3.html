<title>象限待辦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ec; --surface-3:#eceae3;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --line:#e1e0d9; --ring:rgba(11,11,11,0.10);
    --accent:#4a3aa7; --accent-ink:#ffffff; --accent-soft:rgba(74,58,167,0.10); --accent-soft-2:rgba(74,58,167,0.18);
    --q1:#eb6834; --q1-soft:rgba(235,104,52,0.13); --q1-soft-2:rgba(235,104,52,0.22);
    --q2:#2a78d6; --q2-soft:rgba(42,120,214,0.11); --q2-soft-2:rgba(42,120,214,0.20);
    --q3:#139c6c; --q3-soft:rgba(19,156,108,0.13); --q3-soft-2:rgba(19,156,108,0.22);
    --q4:#6c7078; --q4-soft:rgba(108,112,120,0.11); --q4-soft-2:rgba(108,112,120,0.20);
    --good:#0ca30c; --warning:#c98100; --critical:#d03b3b;
    --warning-soft:rgba(250,178,25,0.18); --critical-soft:rgba(208,59,59,0.13);
    --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 14px rgba(11,11,11,0.05);
    --font-ui:'Noto Sans TC', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --r-lg:14px; --r-md:10px; --r-sm:7px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --page:#0d0d0d; --surface:#191918; --surface-2:#212120; --surface-3:#292927;
      --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8e88;
      --line:#312f2c; --ring:rgba(255,255,255,0.11);
      --accent:#a79bef; --accent-ink:#181722; --accent-soft:rgba(167,155,239,0.16); --accent-soft-2:rgba(167,155,239,0.26);
      --q1:#e07240; --q1-soft:rgba(224,114,64,0.20); --q1-soft-2:rgba(224,114,64,0.32);
      --q2:#5b9bea; --q2-soft:rgba(91,155,234,0.18); --q2-soft-2:rgba(91,155,234,0.30);
      --q3:#2fbb8a; --q3-soft:rgba(47,187,138,0.20); --q3-soft-2:rgba(47,187,138,0.32);
      --q4:#9a9ea6; --q4-soft:rgba(154,158,166,0.16); --q4-soft-2:rgba(154,158,166,0.26);
      --good:#3fc23f; --warning:#f0b429; --critical:#ef6a6a;
      --warning-soft:rgba(240,180,41,0.16); --critical-soft:rgba(239,106,106,0.18);
      --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.28);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#191918; --surface-2:#212120; --surface-3:#292927;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8f8e88;
    --line:#312f2c; --ring:rgba(255,255,255,0.11);
    --accent:#a79bef; --accent-ink:#181722; --accent-soft:rgba(167,155,239,0.16); --accent-soft-2:rgba(167,155,239,0.26);
    --q1:#e07240; --q1-soft:rgba(224,114,64,0.20); --q1-soft-2:rgba(224,114,64,0.32);
    --q2:#5b9bea; --q2-soft:rgba(91,155,234,0.18); --q2-soft-2:rgba(91,155,234,0.30);
    --q3:#2fbb8a; --q3-soft:rgba(47,187,138,0.20); --q3-soft-2:rgba(47,187,138,0.32);
    --q4:#9a9ea6; --q4-soft:rgba(154,158,166,0.16); --q4-soft-2:rgba(154,158,166,0.26);
    --good:#3fc23f; --warning:#f0b429; --critical:#ef6a6a;
    --warning-soft:rgba(240,180,41,0.16); --critical-soft:rgba(239,106,106,0.18);
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.28);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--page); color:var(--ink); font-family:var(--font-ui);
    margin:0; padding:20px 16px calc(28px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; color:var(--ink); }
  ::selection{ background:var(--accent-soft-2); }

  /* ---------- topbar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px; overflow:hidden; flex:none;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px;
    background:var(--line); padding:2px; box-shadow: var(--shadow);
  }
  .brand-mark span{ border-radius:2px; }
  .brand-mark span:nth-child(1){ background:var(--q1); }
  .brand-mark span:nth-child(2){ background:var(--q2); }
  .brand-mark span:nth-child(3){ background:var(--q3); }
  .brand-mark span:nth-child(4){ background:var(--q4); }
  .brand-text h1{ font-size:17px; margin:0; font-weight:900; letter-spacing:.01em; }
  .brand-text p{ margin:1px 0 0; font-size:12px; color:var(--ink-3); }
  .date-chip{
    font-family:var(--font-mono); font-size:12.5px; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-variant-numeric:tabular-nums; box-shadow:var(--shadow);
  }
  .export-menu{ position:relative; }
  .export-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer;
    width:36px; height:36px; border-radius:999px; display:grid; place-items:center;
    transition:background .12s, color .12s; box-shadow:var(--shadow);
  }
  .export-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .export-dropdown{
    position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow); min-width:160px; z-index:999;
  }
  .export-dropdown button{
    display:block; width:100%; border:none; background:transparent; color:var(--ink-2);
    padding:10px 13px; text-align:left; cursor:pointer; font-size:13px; transition:background .1s;
  }
  .export-dropdown button:hover{ background:var(--surface-2); color:var(--ink); }
  .export-dropdown hr{ border:none; border-top:1px solid var(--line); margin:4px 0; }
  .import-menu{ position:relative; }
  .import-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer;
    width:36px; height:36px; border-radius:999px; display:grid; place-items:center;
    transition:background .12s, color .12s; box-shadow:var(--shadow);
  }
  .import-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .import-dropdown{
    position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow); min-width:180px; z-index:999;
  }
  .import-item, .import-dropdown button{
    display:block; width:100%; border:none; background:transparent; color:var(--ink-2);
    padding:10px 13px; text-align:left; cursor:pointer; font-size:13px; transition:background .1s;
  }
  .import-item{ padding:0; }
  .import-item label{ display:block; padding:10px 13px; cursor:pointer; }
  .import-item:hover label, .import-dropdown button:hover{ background:var(--surface-2); color:var(--ink); }
  .import-dropdown hr{ border:none; border-top:1px solid var(--line); margin:4px 0; }

  /* ---------- quick add ---------- */
  .quickadd{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:9px 10px; box-shadow:var(--shadow);
  }
  .quickadd input[type="text"]{
    flex:1 1 220px; min-width:0; border:none; background:transparent; outline:none;
    font-size:14.5px; color:var(--ink); padding:6px 4px;
  }
  .quickadd input[type="text"]::placeholder{ color:var(--ink-3); }
  .qpick{ display:flex; gap:4px; background:var(--surface-2); border-radius:999px; padding:3px; flex:none; }
  .qpick button{
    border:none; background:transparent; cursor:pointer; border-radius:999px;
    width:30px; height:26px; display:grid; place-items:center; color:var(--ink-3);
    transition:background .12s, color .12s;
  }
  .qpick button i{ width:9px; height:9px; border-radius:3px; display:block; background:currentColor; opacity:.55; }
  .qpick button[data-q="1"]{ color:var(--q1); }
  .qpick button[data-q="2"]{ color:var(--q2); }
  .qpick button[data-q="3"]{ color:var(--q3); }
  .qpick button[data-q="4"]{ color:var(--q4); }
  .qpick button.active{ background:var(--surface); box-shadow:0 1px 3px rgba(11,11,11,0.12); }
  .qpick button.active i{ opacity:1; }
  .qa-date{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
    border-radius:999px; padding:5px 10px; font-size:12.5px; font-family:var(--font-mono);
  }
  .qa-submit{
    flex:none; border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer;
    width:34px; height:34px; border-radius:999px; display:grid; place-items:center;
    transition:filter .12s;
  }
  .qa-submit:hover{ filter:brightness(1.08); }

  /* ---------- stats ---------- */
  .stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px;
    box-shadow:var(--shadow);
  }
  .stat .txt .label{ font-size:11.5px; color:var(--ink-3); margin:0 0 3px; }
  .stat .txt .value{ font-family:var(--font-mono); font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  .stat .txt .value small{ font-size:12px; font-weight:500; color:var(--ink-3); margin-left:2px; }
  .stat.overdue .value{ color:var(--critical); }
  .ring{ width:38px; height:38px; flex:none; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:3.4; }
  .ring .track{ stroke:var(--line); }
  .ring .fill{ stroke:var(--good); stroke-linecap:round; transition:stroke-dasharray .3s; }

  /* ---------- filters ---------- */
  .filters{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .search{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:7px 12px; flex:1 1 200px; min-width:150px; color:var(--ink-3);
  }
  .search input{ border:none; outline:none; background:transparent; flex:1; font-size:13.5px; color:var(--ink); min-width:0; }
  .tagbar{ display:flex; gap:6px; flex-wrap:wrap; }
  .tagchip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer;
    border-radius:999px; padding:6px 12px; font-size:12.5px; transition:background .12s,border-color .12s,color .12s;
  }
  .tagchip.active{ background:var(--accent-soft-2); border-color:var(--accent); color:var(--accent); font-weight:500; }
  .showdone{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); cursor:pointer; margin-left:auto; user-select:none; }
  .showdone input{ accent-color:var(--accent); width:14px; height:14px; }

  /* ---------- matrix ---------- */
  .matrix{
    display:grid; grid-template-columns:34px 1fr 1fr; grid-template-rows:26px 1fr 1fr;
    gap:12px;
  }
  .axis-label{ display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-3); font-weight:500; }
  .side-label{
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink-3); font-weight:500;
    text-align:center; line-height:1.4;
  }
  .corner{}
  .cell-corner{ grid-column:1; grid-row:1; }
  .cell-axis-a{ grid-column:2; grid-row:1; }
  .cell-axis-b{ grid-column:3; grid-row:1; }
  .cell-side-a{ grid-column:1; grid-row:2; }
  .cell-side-b{ grid-column:1; grid-row:3; }
  .cell-q1{ grid-column:2; grid-row:2; }
  .cell-q2{ grid-column:3; grid-row:2; }
  .cell-q3{ grid-column:2; grid-row:3; }
  .cell-q4{ grid-column:3; grid-row:3; }

  .quad{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
    display:flex; flex-direction:column; min-width:0; overflow:hidden; box-shadow:var(--shadow);
  }
  .quad-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:11px 13px; border-bottom:1px solid var(--line); }
  .quad-head .titles{ min-width:0; }
  .quad-title{ font-size:14px; font-weight:700; margin:0; display:flex; align-items:center; gap:7px; }
  .quad-title .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .quad-sub{ font-size:11.5px; color:var(--ink-3); margin:2px 0 0 15px; }
  .quad-count{ font-family:var(--font-mono); font-size:12px; color:var(--ink-2); background:var(--surface-2); border-radius:999px; padding:3px 9px; flex:none; font-variant-numeric:tabular-nums; }
  .quad[data-quadrant="1"] .quad-title .dot{ background:var(--q1); } .quad[data-quadrant="1"] .quad-head{ background:var(--q1-soft); }
  .quad[data-quadrant="2"] .quad-title .dot{ background:var(--q2); } .quad[data-quadrant="2"] .quad-head{ background:var(--q2-soft); }
  .quad[data-quadrant="3"] .quad-title .dot{ background:var(--q3); } .quad[data-quadrant="3"] .quad-head{ background:var(--q3-soft); }
  .quad[data-quadrant="4"] .quad-title .dot{ background:var(--q4); } .quad[data-quadrant="4"] .quad-head{ background:var(--q4-soft); }

  .quad-body{ flex:1; min-height:64px; max-height:52vh; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .quad-empty{ font-size:12.5px; color:var(--ink-3); text-align:center; padding:18px 6px; }
  .quad-empty button{ border:none; background:none; color:var(--accent); cursor:pointer; text-decoration:underline; font:inherit; padding:0; margin-left:4px; }

  .task{
    display:flex; align-items:flex-start; gap:7px; background:var(--surface); border:1px solid var(--line);
    border-left:3px solid var(--q-color, var(--line)); border-radius:var(--r-md); padding:8px 8px 8px 6px;
    touch-action:pan-y;
  }
  .task.completed{ opacity:.55; }
  .task.completed .task-title{ text-decoration:line-through; }
  .task.dragging{ box-shadow:0 10px 26px rgba(11,11,11,0.22); opacity:.96; }
  .task-placeholder{ border:1.5px dashed var(--accent); border-radius:var(--r-md); background:var(--accent-soft); margin:0; flex:none; }

  .drag-handle{ width:14px; height:20px; flex:none; position:relative; cursor:grab; touch-action:none; border:none; background:transparent; padding:0; margin-top:2px; }
  .drag-handle::before{ content:''; position:absolute; inset:0; background-image:radial-gradient(circle at 3px 3px, var(--ink-3) 1.3px, transparent 1.5px); background-size:6px 6px; opacity:.75; }

  .task-check{
    appearance:none; -webkit-appearance:none; width:18px; height:18px; margin:1px 0 0; flex:none;
    border:1.6px solid var(--line); border-radius:5px; position:relative; cursor:pointer; background:var(--surface);
  }
  .task-check::after{ content:''; position:absolute; left:5px; top:1px; width:4px; height:8px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(40deg); opacity:0; }
  .task-check:checked{ background:var(--good); border-color:var(--good); }
  .task-check:checked::after{ opacity:1; }

  .task-main{ flex:1; min-width:0; cursor:pointer; }
  .task-title{ font-size:13.5px; line-height:1.4; word-break:break-word; }
  .task-meta{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .mchip{ font-size:11px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); }
  .due{ font-size:11px; padding:2px 8px 2px 6px; border-radius:999px; display:inline-flex; align-items:center; gap:3px; background:var(--surface-2); color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .due.critical{ background:var(--critical-soft); color:var(--critical); }
  .due.warning{ background:var(--warning-soft); color:var(--warning); }
  .due svg{ flex:none; }

  .task-actions{ display:flex; flex-direction:column; gap:2px; flex:none; }
  .task-actions button{ border:none; background:transparent; color:var(--ink-3); cursor:pointer; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; }
  .task-actions button:hover{ background:var(--surface-2); color:var(--ink); }
  .task-actions button.danger:hover{ background:var(--critical-soft); color:var(--critical); }
  .task-actions button.confirm{ background:var(--critical); color:#fff; }

  .quad-add{ border-top:1px solid var(--line); padding:7px; }
  .quad-add input{ width:100%; border:none; background:var(--surface-2); border-radius:999px; padding:8px 12px; font-size:13px; outline:none; color:var(--ink); }
  .quad-add input::placeholder{ color:var(--ink-3); }

  /* ---------- dialog ---------- */
  dialog{
    border:none; border-radius:var(--r-lg); padding:0; background:var(--surface); color:var(--ink);
    width:min(440px, calc(100vw - 32px)); box-shadow:0 20px 50px rgba(0,0,0,0.3);
  }
  dialog::backdrop{ background:rgba(11,11,10,0.42); }
  .dlg-head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .dlg-head h2{ font-size:15px; margin:0; }
  .dlg-close{ border:none; background:transparent; color:var(--ink-3); cursor:pointer; width:26px; height:26px; border-radius:7px; display:grid; place-items:center; }
  .dlg-close:hover{ background:var(--surface-2); }
  .dlg-body{ padding:16px 18px; display:flex; flex-direction:column; gap:13px; max-height:60vh; overflow-y:auto; }
  .field label{ display:block; font-size:12px; color:var(--ink-2); margin-bottom:5px; font-weight:500; }
  .field input[type="text"], .field input[type="date"], .field textarea{
    width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:var(--r-sm);
    padding:9px 10px; font-size:13.5px; outline:none; color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:56px; }
  .field input:focus, .field textarea:focus{ border-color:var(--accent); }
  .qseg{ display:flex; gap:6px; flex-wrap:wrap; }
  .qseg button{
    flex:1 1 auto; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer;
    border-radius:var(--r-sm); padding:8px 6px; font-size:12px; display:flex; align-items:center; gap:6px; justify-content:center;
  }
  .qseg button i{ width:8px; height:8px; border-radius:3px; background:currentColor; }
  .qseg button[data-q="1"]{ color:var(--q1); } .qseg button[data-q="2"]{ color:var(--q2); }
  .qseg button[data-q="3"]{ color:var(--q3); } .qseg button[data-q="4"]{ color:var(--q4); }
  .qseg button.active{ border-color:currentColor; background:var(--surface); font-weight:600; }
  .dlg-foot{ padding:14px 18px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .btn{ border:none; border-radius:999px; padding:9px 16px; font-size:13px; cursor:pointer; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-ghost{ background:var(--surface-2); color:var(--ink-2); }
  .btn-danger-text{ background:transparent; color:var(--critical); }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  @media (max-width:760px){
    .stats{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .matrix{ display:flex; flex-direction:column; }
    .cell-corner,.cell-axis-a,.cell-axis-b,.cell-side-a,.cell-side-b{ display:none; }
    .quad-body{ max-height:none; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
      <div class="brand-text">
        <h1>象限待辦</h1>
        <p>艾森豪矩陣 · 依急迫與重要程度排序</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="date-chip" id="dateChip"></div>
      <div class="export-menu" id="exportMenu">
        <button class="export-btn" aria-label="匯出資料">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/><path d="M7 10l3 3 3-3"/><path d="M10 7v6"/></svg>
        </button>
        <div class="export-dropdown" id="exportDropdown" hidden>
          <button data-format="csv" data-type="completed">匯出已完成（CSV）</button>
          <button data-format="json" data-type="completed">匯出已完成（JSON）</button>

          <button data-format="csv" data-type="all">匯出全部（CSV）</button>
          <button data-format="json" data-type="all">匯出全部（JSON）</button>
        </div>
      </div>
      <div class="import-menu" id="importMenu">
        <button class="import-btn" aria-label="匯入資料">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/><path d="M13 10l-3-3-3 3"/><path d="M10 13V7"/></svg>
        </button>
        <div class="import-dropdown" id="importDropdown" hidden>
          <label class="import-item">
            <input type="file" id="importFile" accept=".csv,.json" style="display:none;">
            <span>📁 選擇檔案（CSV/JSON）</span>
          </label>
          <hr>
          <button id="importMerge">合併 - 保留既有資料</button>
          <button id="importReplace">替換 - 清空後導入</button>
        </div>
      </div>
    </div>
  </header>

  <form class="quickadd" id="quickAddForm">
    <div class="qpick" id="quickPick">
      <button type="button" data-q="1" title="立即處理"><i></i></button>
      <button type="button" data-q="2" title="排入計畫"><i></i></button>
      <button type="button" data-q="3" title="委派他人"><i></i></button>
      <button type="button" data-q="4" title="考慮刪除"><i></i></button>
    </div>
    <input type="text" id="quickAddInput" placeholder="新增待辦事項，按 Enter 加入所選象限…" maxlength="140" required>
    <input type="date" class="qa-date" id="quickAddDate">
    <button type="submit" class="qa-submit" aria-label="新增">
      <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>
    </button>
  </form>

  <section class="stats" id="statsRow" aria-label="統計">
    <div class="stat">
      <div class="txt"><p class="label">待辦中</p><p class="value" id="statActive">0</p></div>
    </div>
    <div class="stat">
      <div class="txt"><p class="label">今日已完成</p><p class="value" id="statDoneToday">0</p></div>
    </div>
    <div class="stat overdue">
      <div class="txt"><p class="label">已逾期</p><p class="value" id="statOverdue">0</p></div>
    </div>
    <div class="stat">
      <div class="txt"><p class="label">完成率</p><p class="value" id="statRate">0<small>%</small></p></div>
      <svg class="ring" viewBox="0 0 40 40">
        <circle class="track" cx="20" cy="20" r="16.9"/>
        <circle class="fill" id="ringFill" cx="20" cy="20" r="16.9" stroke-dasharray="0 999"/>
      </svg>
    </div>
  </section>

  <section class="filters" aria-label="篩選">
    <div class="search">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="6"/><path d="M17 17l-4-4" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="搜尋任務或標籤…">
    </div>
    <div class="tagbar" id="tagBar"></div>
    <label class="showdone"><input type="checkbox" id="showDoneToggle"> 顯示已完成</label>
  </section>

  <section class="matrix" aria-label="艾森豪矩陣">
    <div class="cell-corner"></div>
    <div class="axis-label cell-axis-a">急迫</div>
    <div class="axis-label cell-axis-b">不急迫</div>
    <div class="side-label cell-side-a">重<br>要</div>
    <div class="side-label cell-side-b">不<br>重<br>要</div>

    <div class="cell-q1"><div class="quad" data-quadrant="1">
      <header class="quad-head"><div class="titles"><p class="quad-title"><span class="dot"></span>立即處理</p><p class="quad-sub">急迫且重要</p></div><span class="quad-count">0</span></header>
      <div class="quad-body" data-quadrant="1"></div>
      <form class="quad-add" data-quadrant="1"><input type="text" placeholder="新增到「立即處理」…" maxlength="140"></form>
    </div></div>

    <div class="cell-q2"><div class="quad" data-quadrant="2">
      <header class="quad-head"><div class="titles"><p class="quad-title"><span class="dot"></span>排入計畫</p><p class="quad-sub">重要但不急迫</p></div><span class="quad-count">0</span></header>
      <div class="quad-body" data-quadrant="2"></div>
      <form class="quad-add" data-quadrant="2"><input type="text" placeholder="新增到「排入計畫」…" maxlength="140"></form>
    </div></div>

    <div class="cell-q3"><div class="quad" data-quadrant="3">
      <header class="quad-head"><div class="titles"><p class="quad-title"><span class="dot"></span>委派他人</p><p class="quad-sub">急迫但不重要</p></div><span class="quad-count">0</span></header>
      <div class="quad-body" data-quadrant="3"></div>
      <form class="quad-add" data-quadrant="3"><input type="text" placeholder="新增到「委派他人」…" maxlength="140"></form>
    </div></div>

    <div class="cell-q4"><div class="quad" data-quadrant="4">
      <header class="quad-head"><div class="titles"><p class="quad-title"><span class="dot"></span>考慮刪除</p><p class="quad-sub">不急迫也不重要</p></div><span class="quad-count">0</span></header>
      <div class="quad-body" data-quadrant="4"></div>
      <form class="quad-add" data-quadrant="4"><input type="text" placeholder="新增到「考慮刪除」…" maxlength="140"></form>
    </div></div>
  </section>

</div>

<dialog id="editDialog">
  <form method="dialog">
    <div class="dlg-head"><h2>編輯任務</h2><button type="button" class="dlg-close" id="dlgClose">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button></div>
    <div class="dlg-body">
      <div class="field"><label for="editTitle">標題</label><input type="text" id="editTitle" maxlength="140"></div>
      <div class="field"><label>象限</label>
        <div class="qseg" id="editQseg">
          <button type="button" data-q="1"><i></i>立即處理</button>
          <button type="button" data-q="2"><i></i>排入計畫</button>

        <button type="button" class="btn btn-primary" id="editSave">儲存</button>
      </div>

  </form>
</dialog>

<script>
(function(){
  "use strict";

  var QUADRANTS = [
    {id:1, label:"立即處理", sub:"急迫且重要"},
    {id:2, label:"排入計畫", sub:"重要但不急迫"},
    {id:3, label:"委派他人", sub:"急迫但不重要"},
    {id:4, label:"考慮刪除", sub:"不急迫也不重要"}
  ];

  var tasks = [];
  var usingDb = false;
  var dbCol = null;
  var lastQuad = 2;
  var filters = { text:"", tags:new Set(), showCompleted:false };
  var quickAddQuad = 2;

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function pad2(n){ return (n<10?"0":"")+n; }
  function toISODate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  function todayISO(){ return toISODate(new Date()); }
  function nowISO(){ return new Date().toISOString(); }
  function daysBetween(aISO, bISO){
    var a = new Date(aISO+"T00:00:00"), b = new Date(bISO+"T00:00:00");
    return Math.round((b-a)/86400000);
  }

  function safeLocalGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function safeLocalSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  var VISITED_KEY = "eht_visited_v1";
  var LOCAL_TASKS_KEY = "eht_tasks_v1";
  var LAST_QUAD_KEY = "eht_last_quad_v1";

  var lq = safeLocalGet(LAST_QUAD_KEY);
  if (lq && QUADRANTS.some(function(q){return String(q.id)===lq;})) { lastQuad = parseInt(lq,10); quickAddQuad = lastQuad; }

  var isFirstVisit = safeLocalGet(VISITED_KEY) !== "1";
  safeLocalSet(VISITED_KEY, "1");

  /* ---------------- store ---------------- */
  function loadLocalTasks(){
    var raw = safeLocalGet(LOCAL_TASKS_KEY);
    if (!raw) return [];
    try { var arr = JSON.parse(raw); return Array.isArray(arr) ? arr : []; } catch(e){ return []; }
  }
  function saveLocalTasks(){
    safeLocalSet(LOCAL_TASKS_KEY, JSON.stringify(tasks));
  }
  function localId(){ return "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function nextOrder(quadId){
    var mx = -1;
    tasks.forEach(function(t){ if (t.quadrant === quadId && typeof t.order === "number" && t.order > mx) mx = t.order; });
    return mx + 1;
  }

  var Store = {
    add: function(task){
      if (usingDb) {
        return dbCol.add(task).catch(function(e){ console.error("db add failed", e); });
      }
      var t = Object.assign({id: localId()}, task);
      tasks.push(t); saveLocalTasks(); render();
      return Promise.resolve(t);
    },
    update: function(id, patch){
      if (usingDb) {
        return dbCol.doc(id).update(patch).catch(function(e){ console.error("db update failed", e); });
      }
      var t = tasks.find(function(x){return x.id===id;});
      if (t) { Object.assign(t, patch); saveLocalTasks(); render(); }
      return Promise.resolve();
    },
    remove: function(id){
      if (usingDb) {
        return dbCol.doc(id).delete().catch(function(e){ console.error("db delete failed", e); });
      }
      tasks = tasks.filter(function(x){return x.id!==id;});
      saveLocalTasks(); render();
      return Promise.resolve();
    }
  };

  function seedExamples(){
    var today = new Date();
    function shift(days){ var d = new Date(today); d.setDate(d.getDate()+days); return toISODate(d); }
    var seeds = [
      {title:"處理三年級電腦教室網路異常（家長反映）", quadrant:1, tags:["網管","範例"], dueDate:shift(-1), completed:false, order:0, notes:"", createdAt:nowISO(), completedAt:null},
      {title:"撰寫下學期資訊安全教育訓練教材", quadrant:2, tags:["教學","範例"], dueDate:shift(7), completed:false, order:0, notes:"", createdAt:nowISO(), completedAt:null},
      {title:"請設備組協助搬運新到貨的平板推車", quadrant:3, tags:["行政","範例"], dueDate:shift(0), completed:false, order:0, notes:"", createdAt:nowISO(), completedAt:null},
      {title:"整理舊掃描器的保固文件", quadrant:4, tags:["歸檔","範例"], dueDate:null, completed:false, order:0, notes:"", createdAt:nowISO(), completedAt:null}
    ];
    seeds.forEach(function(s){ Store.add(s); });
  }

  function initStore(){
    var useDbPromise;
    try {
      useDbPromise = (typeof window.claude !== "undefined" && window.claude && typeof window.claude.use === "function")
        ? window.claude.use("db") : Promise.resolve(null);
    } catch(e){ useDbPromise = Promise.resolve(null); }

    useDbPromise.then(function(db){
      if (db) {
        usingDb = true;
        dbCol = db.collection("tasks");
        dbCol.onSnapshot(function(snap){
          tasks = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          if (tasks.length === 0 && isFirstVisit) { isFirstVisit = false; seedExamples(); }
          render();
        }, function(err){
          console.error("db snapshot error", err);
        });
      } else {
        usingDb = false;
        tasks = loadLocalTasks();
        if (tasks.length === 0 && isFirstVisit) { isFirstVisit = false; seedExamples(); }
        render();
      }
    }).catch(function(){
      usingDb = false;
      tasks = loadLocalTasks();
      if (tasks.length === 0 && isFirstVisit) { isFirstVisit = false; seedExamples(); }
      render();
    });
  }

  /* ---------------- derived / render ---------------- */
  function uniqueTags(){
    var set = new Set();
    tasks.forEach(function(t){ (t.tags||[]).forEach(function(tag){ set.add(tag); }); });
    return Array.from(set).sort(function(a,b){ return a.localeCompare(b,"zh-Hant"); });
  }

  function taskMatchesFilters(t){
    if (!filters.showCompleted && t.completed) return false;
    if (filters.tags.size > 0) {
      var has = (t.tags||[]).some(function(tag){ return filters.tags.has(tag); });
      if (!has) return false;
    }
    if (filters.text) {
      var hay = (t.title + " " + (t.tags||[]).join(" ") + " " + (t.notes||"")).toLowerCase();
      if (hay.indexOf(filters.text.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function formatDue(t){
    if (!t.dueDate) return null;
    var diff = daysBetween(todayISO(), t.dueDate);
    var cls = "";
    var label;
    if (t.completed) {
      var d = new Date(t.dueDate+"T00:00:00");
      label = (d.getMonth()+1)+"/"+d.getDate();
    } else if (diff < 0) {
      cls = "critical"; label = "逾期 " + (-diff) + " 天";
    } else if (diff === 0) {
      cls = "warning"; label = "今天到期";
    } else if (diff === 1) {
      label = "明天到期";
    } else {
      var d2 = new Date(t.dueDate+"T00:00:00");
      label = (d2.getMonth()+1)+"/"+d2.getDate()+" 到期";
    }
    return {cls:cls, label:label};
  }

  var calendarSvg = '<svg viewBox="0 0 20 20" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="1.6"/><path d="M3 8.3h14M7 3v3M13 3v3"/></svg>';
  var editSvg = '<svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.4 3.6l4 4L6.3 17.7H2.3v-4z"/></svg>';
  var trashSvg = '<svg viewBox="0 0 20 20" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 6.5h10M8 6.5V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M6.3 6.5l.6 9a1.2 1.2 0 0 0 1.2 1.1h3.8a1.2 1.2 0 0 0 1.2-1.1l.6-9"/></svg>';

  function taskCardHtml(t){
    var due = formatDue(t);
    var tagsHtml = (t.tags||[]).filter(function(tg){return tg!=="";}).map(function(tag){
      return '<span class="mchip">'+esc(tag)+'</span>';
    }).join("");
    var dueHtml = due ? '<span class="due '+due.cls+'">'+calendarSvg+esc(due.label)+'</span>' : "";
    return (
      '<article class="task'+(t.completed?" completed":"")+'" data-id="'+esc(t.id)+'" data-quadrant="'+t.quadrant+'" style="--q-color:var(--q'+t.quadrant+')">'+
        '<button type="button" class="drag-handle" aria-label="拖曳排序"></button>'+
        '<input type="checkbox" class="task-check" '+(t.completed?"checked":"")+' aria-label="完成任務">'+
        '<div class="task-main" data-role="open-edit">'+
          '<div class="task-title">'+esc(t.title)+'</div>'+
          ((tagsHtml||dueHtml) ? '<div class="task-meta">'+tagsHtml+dueHtml+'</div>' : '')+
        '</div>'+
        '<div class="task-actions">'+
          '<button type="button" class="edit-btn" aria-label="編輯">'+editSvg+'</button>'+
          '<button type="button" class="del-btn" aria-label="刪除">'+trashSvg+'</button>'+
        '</div>'+
      '</article>'
    );
  }

  function renderQuadrant(q){
    var body = document.querySelector('.quad-body[data-quadrant="'+q.id+'"]');
    var countEl = document.querySelector('.quad[data-quadrant="'+q.id+'"] .quad-count');
    var list = tasks.filter(function(t){ return t.quadrant === q.id; })
                     .filter(taskMatchesFilters)
                     .sort(function(a,b){ return (a.order||0) - (b.order||0); });
    countEl.textContent = list.filter(function(t){ return !t.completed; }).length;
    if (list.length === 0) {
      var total = tasks.filter(function(t){ return t.quadrant === q.id; }).length;
      var msg;
      if (total > 0 && hasActiveFilters()) {
        msg = '沒有符合篩選條件的任務 <button type="button" data-clear-filters>清除篩選</button>';
      } else if (total > 0) {
        msg = '此象限的任務皆已完成，勾選「顯示已完成」可查看';
      } else {
        msg = '目前沒有任務，請在上方新增';
      }
      body.innerHTML = '<p class="quad-empty">' + msg + '</p>';
    } else {
      body.innerHTML = list.map(taskCardHtml).join("");
    }
  }

  function renderStats(){
    var active = tasks.filter(function(t){ return !t.completed; });
    var today = todayISO();
    var doneToday = tasks.filter(function(t){ return t.completed && t.completedAt && t.completedAt.slice(0,10)===today; }).length;
    var overdue = active.filter(function(t){ return t.dueDate && t.dueDate < today; }).length;
    var totalAll = tasks.length;
    var doneAll = tasks.filter(function(t){return t.completed;}).length;
    var rate = totalAll ? Math.round(doneAll/totalAll*100) : 0;

    document.getElementById("statActive").textContent = active.length;
    document.getElementById("statDoneToday").textContent = doneToday;
    document.getElementById("statOverdue").textContent = overdue;
    document.getElementById("statRate").innerHTML = rate + "<small>%</small>";

    var C = 2*Math.PI*16.9;
    document.getElementById("ringFill").setAttribute("stroke-dasharray", (C*rate/100).toFixed(1)+" "+C.toFixed(1));
  }

  function renderTagBar(){
    var bar = document.getElementById("tagBar");
    var tags = uniqueTags();
    bar.innerHTML = tags.map(function(tag){
      return '<button type="button" class="tagchip'+(filters.tags.has(tag)?" active":"")+'" data-tag="'+esc(tag)+'">'+esc(tag)+'</button>';
    }).join("");
  }

  function hasActiveFilters(){
    return !!filters.text || filters.tags.size > 0;
  }
  function clearFilters(){
    filters.text = "";
    filters.tags.clear();
    document.getElementById("searchInput").value = "";
    render();
  }

  function render(){
    renderStats();
    renderTagBar();
    QUADRANTS.forEach(renderQuadrant);
  }

  /* ---------------- date chip ---------------- */
  function renderDateChip(){
    var d = new Date();
    var fmt;
    try {
      fmt = new Intl.DateTimeFormat("zh-TW", {month:"long", day:"numeric", weekday:"short"}).format(d);
    } catch(e){ fmt = toISODate(d); }
    document.getElementById("dateChip").textContent = fmt;
  }
  renderDateChip();

  /* ---------------- quick add ---------------- */
  var quickPick = document.getElementById("quickPick");
  function setQuickPick(qid){
    quickAddQuad = qid;
    quickPick.querySelectorAll("button").forEach(function(b){
      b.classList.toggle("active", parseInt(b.dataset.q,10)===qid);
    });
    safeLocalSet(LAST_QUAD_KEY, String(qid));
  }
  quickPick.querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){ setQuickPick(parseInt(b.dataset.q,10)); });
  });
  setQuickPick(quickAddQuad);

  document.getElementById("quickAddForm").addEventListener("submit", function(e){
    e.preventDefault();
    var input = document.getElementById("quickAddInput");
    var dateInput = document.getElementById("quickAddDate");
    var title = input.value.trim();
    if (!title) return;
    var candidate = {
      title: title, quadrant: quickAddQuad, tags: [], dueDate: dateInput.value || null,
      completed:false, order: nextOrder(quickAddQuad), notes:"", createdAt: nowISO(), completedAt:null
    };
    if (!taskMatchesFilters(candidate)) clearFilters();
    Store.add(candidate);
    input.value = ""; dateInput.value = ""; input.focus();
  });

  document.querySelectorAll(".quad-add").forEach(function(form){
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var qid = parseInt(form.dataset.quadrant,10);
      var input = form.querySelector("input");
      var title = input.value.trim();
      if (!title) return;
      var candidate2 = {
        title:title, quadrant:qid, tags:[], dueDate:null, completed:false,
        order: nextOrder(qid), notes:"", createdAt: nowISO(), completedAt:null
      };
      if (!taskMatchesFilters(candidate2)) clearFilters();
      Store.add(candidate2);
      input.value = "";
    });
  });

  /* ---------------- filters ---------------- */
  document.getElementById("searchInput").addEventListener("input", function(e){
    filters.text = e.target.value.trim();
    render();
  });
  document.getElementById("showDoneToggle").addEventListener("change", function(e){
    filters.showCompleted = e.target.checked;
    render();
  });
  document.addEventListener("click", function(e){
    if (e.target.closest("[data-clear-filters]")) clearFilters();
  });
  document.getElementById("tagBar").addEventListener("click", function(e){
    var btn = e.target.closest(".tagchip");
    if (!btn) return;
    var tag = btn.dataset.tag;
    if (filters.tags.has(tag)) filters.tags.delete(tag); else filters.tags.add(tag);
    render();
  });

  /* ---------------- task interactions (delegated) ---------------- */
  document.addEventListener("change", function(e){
    var chk = e.target.closest(".task-check");
    if (!chk) return;
    var card = chk.closest(".task");
    var id = card.dataset.id;
    Store.update(id, {completed: chk.checked, completedAt: chk.checked ? nowISO() : null});
  });

  var confirmingDeleteId = null;
  document.addEventListener("click", function(e){
    var openBtn = e.target.closest('[data-role="open-edit"]');
    var editBtn = e.target.closest(".edit-btn");
    var delBtn = e.target.closest(".del-btn");

    if (openBtn || editBtn) {
      var card = (openBtn||editBtn).closest(".task");
      openEditDialog(card.dataset.id);
      return;
    }
    if (delBtn) {
      var card2 = delBtn.closest(".task");
      var id2 = card2.dataset.id;
      if (confirmingDeleteId === id2) {
        Store.remove(id2);
        confirmingDeleteId = null;
      } else {
        confirmingDeleteId = id2;
        delBtn.classList.add("confirm");
        delBtn.innerHTML = trashSvg;
        delBtn.setAttribute("aria-label","再按一次確認刪除");
        setTimeout(function(){
          if (confirmingDeleteId === id2) { confirmingDeleteId = null; render(); }
        }, 2800);
      }
      return;
    }
  });

  /* ---------------- edit dialog ---------------- */
  var dlg = document.getElementById("editDialog");
  var editingId = null;
  var editQuad = 1;

  function openEditDialog(id){
    var t = tasks.find(function(x){return x.id===id;});
    if (!t) return;
    editingId = id; editQuad = t.quadrant;
    document.getElementById("editTitle").value = t.title || "";
    document.getElementById("editDate").value = t.dueDate || "";
    document.getElementById("editTags").value = (t.tags||[]).join(", ");
    document.getElementById("editNotes").value = t.notes || "";
    setEditQseg(editQuad);
    dlg.showModal();
  }
  function setEditQseg(qid){
    editQuad = qid;
    document.getElementById("editQseg").querySelectorAll("button").forEach(function(b){
      b.classList.toggle("active", parseInt(b.dataset.q,10)===qid);
    });
  }
  document.getElementById("editQseg").querySelectorAll("button").forEach(function(b){
    b.addEventListener("click", function(){ setEditQseg(parseInt(b.dataset.q,10)); });
  });
  document.getElementById("dlgClose").addEventListener("click", function(){ dlg.close(); });
  document.getElementById("editCancel").addEventListener("click", function(){ dlg.close(); });
  document.getElementById("editSave").addEventListener("click", function(){
    if (!editingId) return;
    var title = document.getElementById("editTitle").value.trim();
    if (!title) return;
    var tags = document.getElementById("editTags").value.split(",").map(function(s){return s.trim();}).filter(function(s){return s;});
    var dueDate = document.getElementById("editDate").value || null;
    var notes = document.getElementById("editNotes").value.trim();
    Store.update(editingId, {title:title, quadrant:editQuad, tags:tags, dueDate:dueDate, notes:notes});
    dlg.close();
    editingId = null;
  });
  document.getElementById("editDelete").addEventListener("click", function(){
    if (!editingId) return;
    Store.remove(editingId);
    dlg.close();
    editingId = null;
  });

  /* ---------------- drag & drop (pointer events) ---------------- */
  var dragState = null;

  document.addEventListener("pointerdown", function(e){
    var handle = e.target.closest(".drag-handle");
    if (!handle) return;
    var card = handle.closest(".task");
    var list = card.parentElement;
    var rect = card.getBoundingClientRect();

    var placeholder = document.createElement("div");
    placeholder.className = "task-placeholder";
    placeholder.style.height = rect.height + "px";

    dragState = {
      id: card.dataset.id, card: card, placeholder: placeholder,
      offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
      width: rect.width
    };

    list.insertBefore(placeholder, card.nextSibling);
    card.style.position = "fixed";
    card.style.zIndex = "1000";
    card.style.width = rect.width + "px";
    card.style.left = rect.left + "px";
    card.style.top = rect.top + "px";
    card.style.pointerEvents = "none";
    card.classList.add("dragging");
    try { handle.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  });

  document.addEventListener("pointermove", function(e){
    if (!dragState) return;
    var card = dragState.card;
    card.style.left = (e.clientX - dragState.offsetX) + "px";
    card.style.top = (e.clientY - dragState.offsetY) + "px";

    card.style.display = "none";
    var under = document.elementFromPoint(e.clientX, e.clientY);
    card.style.display = "";

    var dropZone = under && under.closest(".quad-body");
    if (!dropZone) return;

    var siblings = Array.prototype.slice.call(dropZone.querySelectorAll(".task")).filter(function(s){ return s !== card; });
    var placed = false;
    for (var i=0; i<siblings.length; i++) {
      var sRect = siblings[i].getBoundingClientRect();
      if (e.clientY < sRect.top + sRect.height/2) {
        dropZone.insertBefore(dragState.placeholder, siblings[i]);
        placed = true;
        break;
      }
    }
    if (!placed) dropZone.appendChild(dragState.placeholder);
  });

  function endDrag(){
    if (!dragState) return;
    var card = dragState.card, placeholder = dragState.placeholder;
    var targetList = placeholder.parentElement;
    targetList.insertBefore(card, placeholder);
    placeholder.remove();
    card.style.position = ""; card.style.zIndex = ""; card.style.width = "";
    card.style.left = ""; card.style.top = ""; card.style.pointerEvents = "";
    card.classList.remove("dragging");

    var newQuad = parseInt(targetList.dataset.quadrant, 10);
    var ids = Array.prototype.slice.call(targetList.querySelectorAll(".task")).map(function(el){ return el.dataset.id; });
    ids.forEach(function(id, idx){
      var t = tasks.find(function(x){ return x.id === id; });
      if (!t) return;
      var patch = {};
      if (t.order !== idx) patch.order = idx;
      if (t.quadrant !== newQuad) patch.quadrant = newQuad;
      if (Object.keys(patch).length) { Object.assign(t, patch); Store.update(id, patch); }
    });
    if (!usingDb) { saveLocalTasks(); }
    render();
    dragState = null;
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  /* ---------------- export data ---------------- */
  var exportBtn = document.querySelector(".export-btn");
  var exportDropdown = document.getElementById("exportDropdown");

  exportBtn.addEventListener("click", function(){
    exportDropdown.hidden = !exportDropdown.hidden;
  });

  document.addEventListener("click", function(e){
    if (!e.target.closest(".export-menu")) {
      exportDropdown.hidden = true;
    }
  });

  function downloadFile(content, filename, mimetype){
    var blob = new Blob([content], {type: mimetype});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportToCSV(taskList){
    var lines = [
      ['象限', '標題', '標籤', '截止日期', '狀態', '建立日期', '備註'].map(function(h){ return '"'+h+'"'; }).join(",")
    ];
    taskList.forEach(function(t){
      var quad = {1:"立即處理", 2:"排入計畫", 3:"委派他人", 4:"考慮刪除"}[t.quadrant] || "";
      var status = t.completed ? "已完成" : "待辦";
      var tags = (t.tags||[]).join("; ");
      var row = [quad, t.title, tags, t.dueDate||"", status, t.createdAt.slice(0,10), t.notes||""];
      lines.push(row.map(function(v){ return '"'+(v+"").replace(/"/g, '""')+'"'; }).join(","));
    });
    return lines.join("\n");
  }

  function exportToJSON(taskList){
    var data = taskList.map(function(t){
      return {
        象限: {1:"立即處理", 2:"排入計畫", 3:"委派他人", 4:"考慮刪除"}[t.quadrant],
        標題: t.title,
        標籤: t.tags || [],
        截止日期: t.dueDate || null,
        狀態: t.completed ? "已完成" : "待辦",
        建立日期: t.createdAt,
        完成日期: t.completedAt || null,
        備註: t.notes || ""
      };
    });
    return JSON.stringify(data, null, 2);
  }

  exportDropdown.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){
      var format = btn.dataset.format;
      var type = btn.dataset.type;
      var taskList = type === "completed" ? tasks.filter(function(t){ return t.completed; }) : tasks;

      if (taskList.length === 0) {
        alert("沒有符合條件的任務");
        return;
      }

      var content = format === "csv" ? exportToCSV(taskList) : exportToJSON(taskList);
      var ext = format === "csv" ? "csv" : "json";
      var filename = "象限待辦_" + todayISO() + "." + ext;
      var mimetype = format === "csv" ? "text/csv;charset=utf-8" : "application/json;charset=utf-8";

      downloadFile(content, filename, mimetype);
      exportDropdown.hidden = true;
    });
  });

  /* ---------------- import data ---------------- */
  var importBtn = document.querySelector(".import-btn");
  var importDropdown = document.getElementById("importDropdown");
  var importFile = document.getElementById("importFile");
  var selectedFile = null;

  importBtn.addEventListener("click", function(){
    importDropdown.hidden = !importDropdown.hidden;
  });

  document.addEventListener("click", function(e){
    if (!e.target.closest(".import-menu")) {
      importDropdown.hidden = true;
    }
  });

  importFile.addEventListener("change", function(e){
    selectedFile = e.target.files[0];
    if (selectedFile) {
      document.getElementById("importMerge").disabled = false;
      document.getElementById("importReplace").disabled = false;
    }
  });

  function parseCSV(text){
    var lines = text.trim().split("\n");
    if (lines.length < 2) return [];

    var headers = lines[0].split(",").map(function(h){ return h.replace(/"/g, "").trim(); });
    var result = [];

    for (var i = 1; i < lines.length; i++) {
      var values = [];
      var current = "";
      var inQuote = false;

      for (var j = 0; j < lines[i].length; j++) {
        var char = lines[i][j];
        if (char === '"') { inQuote = !inQuote; }
        else if (char === "," && !inQuote) { values.push(current.replace(/"/g, "").trim()); current = ""; }
        else { current += char; }
      }
      values.push(current.replace(/"/g, "").trim());

      if (values.length === headers.length) {
        var obj = {};
        headers.forEach(function(h, idx){ obj[h] = values[idx]; });
        result.push(obj);
      }
    }
    return result;
  }

  function normalizeTags(raw){
    var list = Array.isArray(raw) ? raw : String(raw || "").split(";");
    return list.map(function(t){ return String(t).trim(); }).filter(function(t){ return t; });
  }

  function importTasks(data, isMerge){
    var newTasks = [];
    var quadMap = {"立即處理":1, "排入計畫":2, "委派他人":3, "考慮刪除":4};

    data.forEach(function(row){
      var quad = quadMap[row.象限 || row.Quadrant] || 2;
      var title = row.標題 || row.Title || "";
      if (!title.trim()) return;

      var task = {
        id: "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        quadrant: quad,
        title: title,
        tags: normalizeTags(row.標籤 || row.Tags),
        dueDate: row.截止日期 || row.DueDate || null,
        completed: (row.狀態 || row.Status || "") === "已完成",
        order: newTasks.length,
        notes: row.備註 || row.Notes || "",
        createdAt: nowISO(),
        completedAt: (row.狀態 || row.Status || "") === "已完成" ? nowISO() : null
      };
      newTasks.push(task);
    });

    if (!isMerge) tasks = [];

    newTasks.forEach(function(t){ Store.add(t); });

    var msg = newTasks.length + " 筆任務已" + (isMerge ? "合併" : "匯入");
    alert(msg);
    importDropdown.hidden = true;
    selectedFile = null;
    importFile.value = "";
  }

  document.getElementById("importMerge").addEventListener("click", function(){
    if (!selectedFile) { alert("請先選擇檔案"); return; }

    var reader = new FileReader();
    reader.onload = function(e){
      var content = e.target.result;
      var data = selectedFile.name.endsWith(".json")
        ? JSON.parse(content)
        : parseCSV(content);
      importTasks(data, true);
    };
    reader.onerror = function(){ alert("檔案讀取失敗"); };
    reader.readAsText(selectedFile, "utf-8");
  });

  document.getElementById("importReplace").addEventListener("click", function(){
    if (!selectedFile) { alert("請先選擇檔案"); return; }
    if (!confirm("確定要清空所有任務並匯入新資料嗎？")) return;

    var reader = new FileReader();
    reader.onload = function(e){
      var content = e.target.result;
      var data = selectedFile.name.endsWith(".json")
        ? JSON.parse(content)
        : parseCSV(content);
      importTasks(data, false);
    };
    reader.onerror = function(){ alert("檔案讀取失敗"); };
    reader.readAsText(selectedFile, "utf-8");
  });

  /* ---------------- go ---------------- */
  initStore();
})();
</script>
